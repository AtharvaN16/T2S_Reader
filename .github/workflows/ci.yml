name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: List Xcode apps
        run: ls -ld /Applications/Xcode*.app || true
      - name: Verify and select Xcode 26.6
        shell: bash
        run: |
          selected=""
          for candidate in /Applications/Xcode*.app; do
            [[ -d "$candidate" ]] || continue
            version="$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | head -n 1)"
            if [[ "$version" == "Xcode 26.6"* ]]; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "Xcode 26.6 is required but was not found under /Applications." >&2
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Restore SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-xcode-26.6-swiftpm-root-${{ hashFiles('Package.resolved', 'Packages/T2SReadium/Package.resolved', 'App/T2SReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.6-swiftpm-root-
      - run: swift test
      - run: scripts/check-licenses.sh
  readium-ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SPM_CLONED_PACKAGES_DIR: ${{ github.workspace }}/.build/SourcePackages
    steps:
      - uses: actions/checkout@v4
      - name: List Xcode apps
        run: ls -ld /Applications/Xcode*.app || true
      - name: Verify and select Xcode 26.6
        shell: bash
        run: |
          selected=""
          for candidate in /Applications/Xcode*.app; do
            [[ -d "$candidate" ]] || continue
            version="$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | head -n 1)"
            if [[ "$version" == "Xcode 26.6"* ]]; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "Xcode 26.6 is required but was not found under /Applications." >&2
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Restore Xcode source packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: ${{ runner.os }}-xcode-26.6-source-packages-${{ hashFiles('Package.resolved', 'Packages/T2SReadium/Package.resolved', 'App/T2SReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.6-source-packages-
      - name: Resolve Readium package dependencies
        working-directory: Packages/T2SReadium
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Resolving package dependencies (attempt $attempt/3)"
            if xcodebuild -resolvePackageDependencies -scheme T2SReadium \
              -derivedDataPath .build/DerivedData \
              -clonedSourcePackagesDirPath "$SPM_CLONED_PACKAGES_DIR"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
          done
          exit 1
      - run: scripts/test-readium.sh -clonedSourcePackagesDirPath "$SPM_CLONED_PACKAGES_DIR"
  app-ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SPM_CLONED_PACKAGES_DIR: ${{ github.workspace }}/.build/SourcePackages
    steps:
      - uses: actions/checkout@v4
      - name: List Xcode apps
        run: ls -ld /Applications/Xcode*.app || true
      - name: Verify and select Xcode 26.6
        shell: bash
        run: |
          selected=""
          for candidate in /Applications/Xcode*.app; do
            [[ -d "$candidate" ]] || continue
            version="$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | head -n 1)"
            if [[ "$version" == "Xcode 26.6"* ]]; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "Xcode 26.6 is required but was not found under /Applications." >&2
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Restore Xcode source packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: ${{ runner.os }}-xcode-26.6-source-packages-${{ hashFiles('Package.resolved', 'Packages/T2SReadium/Package.resolved', 'App/T2SReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.6-source-packages-
      - run: brew install xcodegen
      - name: Generate app project
        working-directory: App
        run: xcodegen generate --quiet
      - name: Resolve app package dependencies
        working-directory: App
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Resolving package dependencies (attempt $attempt/3)"
            if xcodebuild -resolvePackageDependencies -project T2SReader.xcodeproj -scheme T2SReader \
              -clonedSourcePackagesDirPath "$SPM_CLONED_PACKAGES_DIR"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
          done
          exit 1
      - run: scripts/build-app.sh -clonedSourcePackagesDirPath "$SPM_CLONED_PACKAGES_DIR"
