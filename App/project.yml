# App/project.yml — the iOS app. Regenerate the .xcodeproj with `xcodegen generate` (never hand-edit it).
name: T2SReader
options:
  bundleIdPrefix: com.t2s
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
# Project-level defaults for the app's identity. A target's `Local.xcconfig` (git-ignored, per Mac)
# sits *above* project settings and *below* target settings in Xcode's precedence, so these three
# are the only identity settings a target may not set itself: `Local.xcconfig` overrides them, and
# the targets reference them through `$(...)`. A second developer's team cannot register the owner's
# app group, so they put their own `T2S_APP_GROUP` (and `T2S_BUNDLE_ID`, `DEVELOPMENT_TEAM`) there
# rather than editing tracked files — `AppPaths.appGroupIdentifier` reads the group back out of the
# bundle's `T2SAppGroupIdentifier`.
settings:
  base:
    T2S_BUNDLE_ID: com.t2s.reader
    T2S_APP_GROUP: group.com.t2s.reader
    # Which entitlements file signs the app (sync spec §8): the plain one, app groups only, by
    # default; `Local.xcconfig` on a paid team points at `T2SReader.iCloud.entitlements`, which
    # adds CloudKit with `T2S_ICLOUD_CONTAINER`. The owner's free team cannot carry iCloud, so
    # the default build never mentions it.
    T2S_ENTITLEMENTS: T2SReader/T2SReader.entitlements
    T2S_ICLOUD_CONTAINER: ""
    CODE_SIGN_ENTITLEMENTS: $(T2S_ENTITLEMENTS)
packages:
  T2S:
    path: ..
  T2SReadium:
    path: ../Packages/T2SReadium
  T2SKokoro:
    path: ../Packages/T2SKokoro
  # Listed even though no target names it: this local package takes the SwiftPM identity
  # `mlxutilslibrary` for the whole graph, which is what keeps ZIPFoundation — and Readium's
  # colliding fork of it — resolvable. See Packages/MLXUtilsLibrary/README.md.
  MLXUtilsLibrary:
    path: ../Packages/MLXUtilsLibrary
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
targetTemplates:
  # Both app targets are the same app, built from the same sources. `T2SReader` is the
  # everyday build; `T2SReaderKokoro` adds the on-device engine and cannot build for the
  # simulator at all.
  T2SReaderApp:
    type: application
    platform: iOS
    sources:
      # Both generated Info.plists sit in this directory. Each target's own is consumed by
      # INFOPLIST_FILE, but the other target's would otherwise be copied in as a stray resource —
      # and, in the Kokoro target, collide with the bundle's own Info.plist.
      - path: T2SReader
        excludes:
          - Info.plist
          - Info-Kokoro.plist
      # `Resources/Kokoro` (~342 MB of MLX weights) is only usable by the Kokoro target and is
      # added under `T2SReaderKokoro` alone. `Resources/KokoroCoreML` (the Core ML stages, voices
      # and runtime JSON that `scripts/fetch-kokoro-coreml.sh --app` stages for the package's tests)
      # is bundled by neither target since 2026-09-10: the phone downloads and compiles the model on
      # its first launch (`KokoroCoreMLInstall`), so an install is ~60 MB rather than 676 MB.
      - path: Resources
        excludes:
          - Kokoro
          - KokoroCoreML
        buildPhase: resources
    dependencies:
      - target: T2SReaderShare
        embed: true
      - sdk: MediaPlayer.framework
      - package: T2S
        product: T2SCore
      - package: T2S
        product: T2SAudio
      - package: T2S
        product: T2SStore
      - package: T2S
        product: T2SLibrary
      - package: T2S
        product: T2SApp
      - package: T2SReadium
        product: T2SReadium
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
    info:
      properties:
        CFBundleDisplayName: t2s
        T2SAppGroupIdentifier: $(T2S_APP_GROUP)
        T2SICloudContainer: $(T2S_ICLOUD_CONTAINER)
        T2SCloudVoiceKey: $(T2S_CLOUD_VOICE_KEY)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.t2s.reader.prepare]
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Italic.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - InterDisplay-ExtraBold.ttf
          - InterDisplay-Black.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
        # The link path loads arbitrary article pages in a WKWebView; plenty are still http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: com.t2s.reader.import
            CFBundleURLSchemes: [t2s]
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T2S_BUNDLE_ID)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here (owner's call, 2026-09-09) — and a team picked in Xcode's
        # Signing & Capabilities lives in project.pbxproj, which `xcodegen generate` rewrites from
        # this file on every build-script run, which is why it kept going back to None. The team
        # lives in `Local.xcconfig` (git-ignored, per Mac; the build scripts create it from
        # `Local.xcconfig.example`), wired in through `configFiles` below.
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
targets:
  # The everyday build: no MLX, so it runs in the simulator and is what CI builds.
  T2SReader:
    templates: [T2SReaderApp]
    info:
      path: T2SReader/Info.plist
  # The iPhone build with the on-device engine. mlx-swift cannot link against the simulator SDK
  # (`_MTLIOErrorDomain` and `_MTLTensorDomain` are absent from it), and neither Xcode nor SwiftPM
  # can link a package product for one SDK only — hence a second target rather than a build flag.
  # Same bundle identifier and display name: it is the same app, built for a phone. The product
  # name stays the target name so the two `.app`s never overwrite each other in a shared
  # DerivedData.
  T2SReaderKokoro:
    templates: [T2SReaderApp]
    info:
      path: T2SReader/Info-Kokoro.plist
    sources:
      # Flat-copied to the bundle root, which is where `KokoroResources.bundled(in:)` looks.
      - path: Resources/Kokoro
        buildPhase: resources
      # The Core ML model is not bundled (see the template above). `KokoroCoreMLResources.locate(in:)`
      # still looks in the bundle first, so a developer who adds `Resources/KokoroCoreML` back here
      # gets a build that skips the download.
    dependencies:
      - package: T2SKokoro
        product: T2SKokoro
    settings:
      base:
        SUPPORTED_PLATFORMS: iphoneos
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOKORO_ENGINE"
        # The stages are loaded by URL through `KokoroCoreMLModels`, so the eight generated Swift
        # classes Xcode would otherwise emit per `.mlpackage` are dead code in the app target.
        # The spike harness set the same flag.
        COREML_CODEGEN_LANGUAGE: None
  T2SReaderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: T2SReaderShare
      - path: T2SReader/Shared
      - path: Resources/Readability
        buildPhase: resources
    dependencies:
      - package: T2S
        product: T2SCore
      - package: T2S
        product: T2SAudio
      - package: T2S
        product: T2SStore
      - package: T2S
        product: T2SLibrary
      - package: T2S
        product: T2SApp
      - package: T2SReadium
        product: T2SReadium
    entitlements:
      path: T2SReaderShare/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: ["$(T2S_APP_GROUP)"]
    info:
      path: T2SReaderShare/Info.plist
      properties:
        T2SAppGroupIdentifier: $(T2S_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 8
        CFBundleDisplayName: Add to t2s
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T2S_BUNDLE_ID).share
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
# Two schemes with plain names, so the Xcode picker needs no explanation: Phone builds the app you
# install on an iPhone (the T2SReaderKokoro target); Simulator builds the Mac-only test build
# (T2SReader). The build scripts and CI use the same two names.
schemes:
  # Phone runs Release: it is the build the owner listens to, and every Swift-side stage of the
  # render — the hn-NSF DSP, the seam and tail-click scans, the crossfade, the tokenizer, the
  # segmenter, the Reader's typesetter — runs -Onone under Debug, 10–50× slower for tight loops
  # (docs/superpowers/specs/2026-09-08-performance-audit.md §6.1). The spike that measured RTF 0.18
  # was a Release harness. The MLX development override (`T2S_KOKORO_DEBUG_OVERRIDE`) is compiled
  # out of Release; set the Run configuration back to Debug by hand for that one experiment.
  Phone:
    build:
      targets:
        T2SReaderKokoro: all
    run:
      config: Release
    archive:
      config: Release
  Simulator:
    build:
      targets:
        T2SReader: all
    run:
      config: Debug
    archive:
      config: Release
