# App/project.yml — the iOS app. Regenerate the .xcodeproj with `xcodegen generate` (never hand-edit it).
name: T2SReader
options:
  bundleIdPrefix: com.t2s
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  T2S:
    path: ..
  T2SReadium:
    path: ../Packages/T2SReadium
  T2SKokoro:
    path: ../Packages/T2SKokoro
  # Listed even though no target names it: this local package takes the SwiftPM identity
  # `mlxutilslibrary` for the whole graph, which is what keeps ZIPFoundation — and Readium's
  # colliding fork of it — resolvable. See Packages/MLXUtilsLibrary/README.md.
  MLXUtilsLibrary:
    path: ../Packages/MLXUtilsLibrary
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
targets:
  T2SReader:
    type: application
    platform: iOS
    sources:
      - path: T2SReader
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: T2SReaderShare
        embed: true
      - sdk: MediaPlayer.framework
      - package: T2S
        product: T2SCore
      - package: T2S
        product: T2SAudio
      - package: T2S
        product: T2SStore
      - package: T2S
        product: T2SLibrary
      - package: T2S
        product: T2SApp
      - package: T2SReadium
        product: T2SReadium
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
    entitlements:
      path: T2SReader/T2SReader.entitlements
      properties:
        com.apple.security.application-groups: [group.com.t2s.reader]
    info:
      path: T2SReader/Info.plist
      properties:
        CFBundleDisplayName: t2s
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.t2s.reader.prepare]
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - InterDisplay-ExtraBold.ttf
          - InterDisplay-Black.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
        # The link path loads arbitrary article pages in a WKWebView; plenty are still http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: com.t2s.reader.import
            CFBundleURLSchemes: [t2s]
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.t2s.reader
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  T2SReaderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: T2SReaderShare
      - path: T2SReader/Shared
      - path: Resources/Readability
        buildPhase: resources
    dependencies:
      - package: T2S
        product: T2SCore
      - package: T2S
        product: T2SAudio
      - package: T2S
        product: T2SStore
      - package: T2S
        product: T2SLibrary
      - package: T2S
        product: T2SApp
      - package: T2SReadium
        product: T2SReadium
    entitlements:
      path: T2SReaderShare/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.t2s.reader]
    info:
      path: T2SReaderShare/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 8
        CFBundleDisplayName: Add to t2s
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.t2s.reader.share
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
