# Spike harness — throwaway. Regenerate the .xcodeproj with `xcodegen generate` (never hand-edit it).
name: SpikeHarness
options:
  bundleIdPrefix: com.t2s.spike
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  KokoroSwift:
    url: https://github.com/mlalma/kokoro-ios
    exactVersion: 1.0.11
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: 0.0.6
  # Already a transitive dependency of KokoroSwift; declared directly so the Core ML arm can
  # `import MisakiSwift` and drive G2P itself. Same URL and version, so SPM resolves one copy.
  MisakiSwift:
    url: https://github.com/mlalma/MisakiSwift
    exactVersion: 1.0.6
  # mattmireles/kokoro-coreml has no root Package.swift: the low-level, dependency-free
  # `KokoroPipeline` package lives in the repo's swift/ subdirectory, and SwiftPM cannot consume a
  # subdirectory by URL. scripts/fetch-kokoro-coreml.sh clones the repo at a pinned commit into
  # .deps/ (git-ignored); run it before `xcodegen generate`.
  KokoroPipeline:
    path: .deps/kokoro-coreml/swift
targets:
  SpikeHarness:
    type: application
    platform: iOS
    sources:
      - path: SpikeHarness
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KokoroSwift
        product: KokoroSwift
      - package: MLXUtilsLibrary
        product: MLXUtilsLibrary
      - package: MisakiSwift
        product: MisakiSwift
      - package: KokoroPipeline
        product: KokoroPipeline
    info:
      path: SpikeHarness/Info.plist
      properties:
        CFBundleDisplayName: Spike Harness
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.t2s.spike.prepare]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.t2s.spike.harness
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Resources/CoreML/**.mlpackage are compiled to .mlmodelc at the bundle root; the Core ML
        # arm loads them by URL through its own KokoroModelProvider, so no generated Swift classes.
        COREML_CODEGEN_LANGUAGE: None
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
